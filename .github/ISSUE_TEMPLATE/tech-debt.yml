name: Tech Debt / Refactor
description: Plan internal cleanup, architecture improvement, maintainability work, or performance-focused refactors.
title: "refactor(<scope>): "
body:
  - type: markdown
    attributes:
      value: |
        ## Engineering source of truth
        Use this Issue to document the current problem, proposed technical direction, scope, non-goals, risks, and acceptance criteria.

        ClickUp is only for task ownership, priority, due date, estimation, and time tracking.

  - type: dropdown
    id: platform
    attributes:
      label: Primary Platform / Surface
      options:
        - Customer frontend
        - Business frontend
        - Admin frontend
        - Core backend
        - Admin backend
        - Core database
        - Admin database
        - Mobile
        - StayBot / AI
        - Infrastructure / DevOps
        - Cross-repository
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Technical Debt
      description: Describe the concrete maintainability, reliability, performance, or architecture problem.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Architecture / Behaviour
      description: Explain how the relevant code or system works today and where the debt exists.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed Change
      description: Describe the intended refactor or technical direction without prescribing unnecessary implementation detail.
    validations:
      required: true

  - type: textarea
    id: why_now
    attributes:
      label: Why Now
      description: Explain the cost/risk of leaving the debt in place and why it should be addressed in this cycle.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In Scope
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit Non-Goals
      description: List related work that must not be pulled into this Issue.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks / Compatibility Considerations
      description: Note behavioral, contract, performance, deployment, or regression risks. Use N/A if none.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Cross-Repository / System Dependencies
      placeholder: Link related Issues/PRs or use N/A.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Refactor objective is achieved without unintended behavior change.
        - [ ] Existing critical flows remain functional.
        - [ ] Relevant tests/checks are updated or added.
        - [ ] New architecture/ownership is understandable from the code and GitHub discussion.
    validations:
      required: true

  - type: input
    id: clickup
    attributes:
      label: ClickUp Tracking Task
      description: Required for ownership, priority, due date, and time tracking only.
      placeholder: https://app.clickup.com/t/...
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Author Confirmation
      options:
        - label: I have documented the technical scope and trade-offs in GitHub rather than relying on ClickUp comments or private messages.
          required: true
