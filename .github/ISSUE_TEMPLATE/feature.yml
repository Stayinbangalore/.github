name: Feature / Requirement
description: Request a new feature, change, or improvement.
title: "feat(<scope>): "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be built or changed?
      placeholder: Keep it concise.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Why is this needed?
      description: Give the minimum context needed to understand the request.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional links to designs, related Issues, PRs, screenshots, or specs.

  - type: input
    id: clickup
    attributes:
      label: ClickUp Task
      description: Used for task ownership, priority, due date, estimate, and time tracking.
      placeholder: https://app.clickup.com/t/...
    validations:
      required: true
