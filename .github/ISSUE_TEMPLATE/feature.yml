name: Feature / Requirement Issue
description: Define a new capability, requirement, or functional improvement.
body:
  - type: markdown
    attributes:
      value: |
        Issue title must follow: `type(scope): concise description in imperative mood`

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Brief 1-2 sentence overview explaining what is being built or changed.
    validations:
      required: true

  - type: textarea
    id: context_requirements
    attributes:
      label: Context & Requirements
      description: Break functional rules down by entity or flow.
      placeholder: |
        - [Entity / Flow A]: Specific behavior, access rules, or UI limits.
        - [Entity / Flow B]: Edge case handling and state requirements.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Direct requirement / user action verified.
        - [ ] Reload / re-hydration edge case works without stale states.
        - [ ] Error states and validation messages display correctly.
    validations:
      required: true

  - type: textarea
    id: tracking
    attributes:
      label: Tracking & References
      placeholder: |
        - ClickUp Task(s):
        - Design / Specs: [Figma Link / Notion Doc]
        - Related PRs: [Links to related active work]
    validations:
      required: true

  - type: textarea
    id: qa
    attributes:
      label: QA Verification
      description: Specific steps, accounts, or configurations necessary for QA validation.
    validations:
      required: true
