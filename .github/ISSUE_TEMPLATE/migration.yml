name: Migration / Contract Change
description: Plan schema, API, data, package, or cross-repository contract changes that require coordinated rollout.
title: "fix(migration): "
body:
  - type: markdown
    attributes:
      value: |
        ## Migration / contract source of truth
        Use this Issue for the current contract, target contract, compatibility plan, rollout order, rollback/recovery, and verification evidence.

        ClickUp is only for task ownership, priority, due date, estimation, and time tracking.

  - type: dropdown
    id: migration_type
    attributes:
      label: Change Type
      options:
        - Database schema migration
        - Data migration / backfill
        - API / DTO contract change
        - Shared package / generated client change
        - Frontend/backend contract migration
        - Infrastructure/configuration migration
        - Other cross-system migration
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Contract / State
      description: Describe the behavior, schema, API, package, or data shape that exists today.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Target Contract / State
      description: Describe the intended final state after migration.
    validations:
      required: true

  - type: textarea
    id: breaking
    attributes:
      label: Breaking Changes / Compatibility Risks
      description: Identify removed/renamed fields, route changes, type changes, incompatible consumers, destructive operations, or other risks. Use N/A if none.
    validations:
      required: true

  - type: textarea
    id: affected
    attributes:
      label: Affected Repositories / Systems
      placeholder: |
        - Stayinbangalore/STAYIN_CORE_DB#...
        - Stayinbangalore/STAYIN_BE#...
        - Stayinbangalore/CUSTOMER_STAYIN_FE#...
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Schema / API / Model Changes
      description: Detail migrations, DTOs, generated clients, fields, routes, indexes, constraints, queues, or configuration changes.
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Backward Compatibility / Transition Strategy
      description: Explain expand/contract behavior, coexistence of old/new fields, compatibility windows, or why compatibility is not required.
    validations:
      required: true

  - type: textarea
    id: sequence
    attributes:
      label: Deployment / Migration Sequence
      placeholder: |
        1. Database/package ...
        2. Backend ...
        3. Frontend/consumer ...
        4. Cleanup ...
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback / Recovery Plan
      description: Explain how to recover if deployment, migration, backfill, or consumer rollout fails.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification Plan
      description: Add production-like rehearsal steps, SQL checks, API verification, package/client checks, or smoke tests as applicable.
      placeholder: |
        - Pre-deploy checks: ...
        - Post-deploy checks: ...
        - Data/contract verification: ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Target contract/state is implemented.
        - [ ] Required consumers are compatible with the deployed state.
        - [ ] Migration/backfill has been verified where applicable.
        - [ ] Rollback/recovery procedure is documented and technically viable.
        - [ ] End-to-end critical flows pass after migration.
    validations:
      required: true

  - type: input
    id: clickup
    attributes:
      label: ClickUp Tracking Task
      description: Required for ownership, priority, due date, and time tracking only.
      placeholder: https://app.clickup.com/t/...
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Author Confirmation
      options:
        - label: I have recorded rollout, compatibility, and rollback information in GitHub rather than relying on ClickUp comments or private messages.
          required: true
