name: Bug / Regression
description: Report broken or unexpected behaviour.
title: "bug(<scope>): "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / Notes
      description: Optional screenshots, logs, videos, links, or other useful context. Do not include secrets or personal data.

  - type: textarea
    id: acceptance
    attributes:
      label: Done When
      placeholder: |
        - [ ] Bug is no longer reproducible
        - [ ] Expected behaviour is verified
    validations:
      required: true

  - type: input
    id: clickup
    attributes:
      label: ClickUp Task
      description: Used for task ownership, priority, due date, estimate, and time tracking.
      placeholder: https://app.clickup.com/t/...
    validations:
      required: true
